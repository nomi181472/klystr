apiVersion: v1
kind: ConfigMap
metadata:
  name: vision-pipeline-config
  namespace: vision-pipeline
  labels:
    app.kubernetes.io/name: vision-pipeline-config
    app.kubernetes.io/part-of: vision-pipeline
data:
  MODEL_ARCHITECTURE: "yolov8x-tensorrt"
  MODEL_WEIGHTS_PATH: "/models/weights/yolov8x_fp16.engine"
  CONFIDENCE_THRESHOLD: "0.65"
  NMS_IOU_THRESHOLD: "0.45"
  INFERENCE_BATCH_SIZE: "16"
  MAX_RTSP_STREAMS: "16"
  FRAME_SAMPLE_RATE: "30"
  ENABLE_GPU_ACCELERATION: "true"
  DETECTION_CLASSES: "person,vehicle,bicycle,backpack,traffic_light"
  METRICS_PORT: "8080"
  GRPC_PORT: "50051"
---
