apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: object-detector-hpa
  namespace: vision-pipeline
  labels:
    app.kubernetes.io/name: object-detector-hpa
    app.kubernetes.io/part-of: vision-pipeline
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: object-detector-inference
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: object-detector-pdb
  namespace: vision-pipeline
  labels:
    app.kubernetes.io/name: object-detector-pdb
    app.kubernetes.io/part-of: vision-pipeline
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: object-detector
