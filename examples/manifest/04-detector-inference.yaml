apiVersion: apps/v1
kind: Deployment
metadata:
  name: object-detector-inference
  namespace: vision-pipeline
  labels:
    app.kubernetes.io/name: object-detector-inference
    app.kubernetes.io/component: inference-engine
    app.kubernetes.io/part-of: vision-pipeline
    app: object-detector
spec:
  replicas: 2
  selector:
    matchLabels:
      app: object-detector
  template:
    metadata:
      labels:
        app: object-detector
        app.kubernetes.io/name: object-detector-inference
        app.kubernetes.io/part-of: vision-pipeline
    spec:
      serviceAccountName: vision-pipeline-sa
      containers:
        - name: yolo-detector
          image: ultralytics/yolov8:v8.2.0-tensorrt
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - -m
            - vision_service.server
          ports:
            - name: grpc-inference
              containerPort: 50051
              protocol: TCP
            - name: http-metrics
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: vision-pipeline-config
          env:
            - name: HF_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vision-model-credentials
                  key: HUGGINGFACE_API_KEY
            - name: S3_KEY
              valueFrom:
                secretKeyRef:
                  name: vision-model-credentials
                  key: S3_ACCESS_KEY_ID
            - name: S3_SECRET
              valueFrom:
                secretKeyRef:
                  name: vision-model-credentials
                  key: S3_SECRET_ACCESS_KEY
          resources:
            requests:
              cpu: "2000m"
              memory: "4Gi"
            limits:
              cpu: "4000m"
              memory: "8Gi"
          volumeMounts:
            - name: model-weights-volume
              mountPath: /models/weights
              readOnly: true
            - name: frame-buffer-volume
              mountPath: /data/frames
          livenessProbe:
            httpGet:
              path: /healthz
              port: http-metrics
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http-metrics
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
      volumes:
        - name: model-weights-volume
          persistentVolumeClaim:
            claimName: pvc-model-weights
        - name: frame-buffer-volume
          persistentVolumeClaim:
            claimName: pvc-frame-buffer
