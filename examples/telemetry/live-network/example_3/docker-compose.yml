services:
  # PostgreSQL 16 Database with 100 Pre-Seeded Books and Users
  db:
    image: postgres:16-alpine
    container_name: bookstore-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: bookstore
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./services/api/schema.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bookstore"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bookstore-net

  # Redis 7 In-Memory Session Token Store
  redis:
    image: redis:7-alpine
    container_name: redis-session
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - bookstore-net

  # REST API Service (Tagged for Docker Hub)
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    image: botonetics/klyster-telemetry-example_3_api:latest
    container_name: bookstore-api
    restart: unless-stopped
    environment:
      PORT: 8080
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: bookstore
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SESSION_TTL_SECONDS: 3600
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      bookstore-net:
        aliases:
          - bookstore-api

  # Interactive SPA Web Frontend
  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
    image: botonetics/klyster-telemetry-example_3_frontend:latest
    container_name: bookstore-frontend
    restart: unless-stopped
    ports:
      - "8088:80"
    depends_on:
      - api
    networks:
      - bookstore-net

  # Background Telemetry Traffic Simulator
  traffic-generator:
    build:
      context: ./services/traffic-generator
      dockerfile: Dockerfile
    image: botonetics/klyster-telemetry-example_3_traffic_gen:latest
    container_name: bookstore-traffic-gen
    restart: unless-stopped
    environment:
      TARGET_URL: http://frontend:80
      BASE_RPS: "6.0"
    depends_on:
      - frontend
    networks:
      - bookstore-net

volumes:
  pgdata:
  redisdata:

networks:
  bookstore-net:
    driver: bridge
