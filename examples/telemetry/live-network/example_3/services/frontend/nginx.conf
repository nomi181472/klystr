events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Resolver for dynamic Kubernetes or Docker DNS resolution
    resolver 127.0.0.11 10.96.0.10 1.1.1.1 valid=10s ipv6=off;

    # Dynamic upstream mapping
    upstream api_service {
        server bookstore-api:8080 max_fails=2 fail_timeout=5s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Static assets
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Health endpoint proxy
        location /healthz {
            proxy_pass http://api_service/healthz;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        # API Reverse Proxy
        location /api/ {
            proxy_pass http://api_service/api/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
    }
}
