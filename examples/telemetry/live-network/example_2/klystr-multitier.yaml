apiVersion: v1
kind: Service
metadata:
  name: db-replica-service
  namespace: klystr-multitier
  labels:
    app: db-replica
    app.kubernetes.io/name: postgresql-replica-service
    telemetry: klystr-multitier
spec:
  type: ClusterIP
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
