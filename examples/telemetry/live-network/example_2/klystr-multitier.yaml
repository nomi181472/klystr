apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: klystr-multitier
  labels:
    app.kubernetes.io/name: frontend-config
    telemetry: klystr-multitier
data:
  nginx.conf: |
    events { 
      worker_connections 2048; 
    }
    http {
      access_log off;
      keepalive_timeout 65;
      
      upstream gateway_upstream {
        server api-gateway-service.klystr-multitier.svc.cluster.local:80;
        keepalive 32;
      }
      
      upstream etl_upstream {
        server etl-service.klystr-multitier.svc.cluster.local:80;
        keepalive 32;
      }

      server {
        listen 80;
        
        location /healthz {
          return 200 "OK\n";
        }
        
        location /api1 {
          proxy_pass http://gateway_upstream;
          proxy_http_version 1.1;
          proxy_set_header Connection "";
          proxy_set_header X-Frontend-Pod $hostname;
          proxy_set_header X-Forwarded-For $remote_addr;
          proxy_set_header Host $host;
          proxy_connect_timeout 2s;
          proxy_read_timeout 5s;
        }

        location /playback {
          proxy_pass http://gateway_upstream/api1;
          proxy_http_version 1.1;
          proxy_set_header Connection "";
          proxy_set_header X-Frontend-Pod $hostname;
          proxy_set_header X-Forwarded-For $remote_addr;
          proxy_set_header Host $host;
          proxy_connect_timeout 2s;
          proxy_read_timeout 5s;
        }
        
        location /api2 {
          proxy_pass http://gateway_upstream;
          proxy_http_version 1.1;
          proxy_set_header Connection "";
          proxy_set_header X-Frontend-Pod $hostname;
          proxy_set_header X-Forwarded-For $remote_addr;
          proxy_set_header Host $host;
          proxy_connect_timeout 2s;
          proxy_read_timeout 5s;
        }

        location /catalog {
          proxy_pass http://gateway_upstream/api2;
          proxy_http_version 1.1;
          proxy_set_header Connection "";
          proxy_set_header X-Frontend-Pod $hostname;
          proxy_set_header X-Forwarded-For $remote_addr;
          proxy_set_header Host $host;
          proxy_connect_timeout 2s;
          proxy_read_timeout 5s;
        }
        
        location /dashboard {
          proxy_pass http://etl_upstream/dashboard;
          proxy_http_version 1.1;
          proxy_set_header Connection "";
          proxy_set_header X-Frontend-Pod $hostname;
          proxy_set_header Host $host;
          proxy_connect_timeout 2s;
          proxy_read_timeout 5s;
        }
        
        location /analytics {
          proxy_pass http://etl_upstream/analytics;
          proxy_http_version 1.1;
          proxy_set_header Connection "";
          proxy_set_header X-Frontend-Pod $hostname;
          proxy_set_header Host $host;
          proxy_connect_timeout 2s;
          proxy_read_timeout 5s;
        }
        
        location /bi {
          proxy_pass http://etl_upstream/api/bi/metrics;
          proxy_http_version 1.1;
          proxy_set_header Connection "";
          proxy_set_header X-Frontend-Pod $hostname;
          proxy_set_header Host $host;
          proxy_connect_timeout 2s;
          proxy_read_timeout 5s;
        }

        location /metrics {
          proxy_pass http://etl_upstream/api/bi/metrics;
          proxy_http_version 1.1;
          proxy_set_header Connection "";
          proxy_set_header X-Frontend-Pod $hostname;
          proxy_set_header Host $host;
          proxy_connect_timeout 2s;
          proxy_read_timeout 5s;
        }
        
        location / {
          proxy_pass http://etl_upstream/dashboard;
          proxy_http_version 1.1;
          proxy_set_header Connection "";
          proxy_set_header X-Frontend-Pod $hostname;
          proxy_set_header Host $host;
        }
      }
    }
