# 2. PostgreSQL Cascading Read Replicas (StatefulSet 2x)
# db-replica-0 replicates from db (Primary)
# db-replica-1 replicates from db-replica-0 (Cascading replica-to-replica WAL streaming)
# ==========================================
apiVersion: v1
kind: Service
metadata:
  name: db-replica-nodes
  namespace: klystr-multitier
  labels:
    app: db-replica
    app.kubernetes.io/name: postgresql-replica-nodes
    telemetry: klystr-multitier
spec:
  clusterIP: None
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
  selector:
    app: db-replica
