                return

            self.send_response(404)
            self.end_headers()
            self.wfile.write(b"Not Found\n")

        def log_message(self, format, *args): pass

    threading.Thread(target=etl_worker, daemon=True).start()
    server = http.server.ThreadingHTTPServer(("0.0.0.0", 8080), BIHandler)
    print(f"[{POD_NAME}] Enterprise BI & ETL server running on port 8080")
    server.serve_forever()
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: traffic-generator-script
  namespace: klystr-multitier
  labels:
    app.kubernetes.io/name: traffic-generator-script
    telemetry: klystr-multitier
data:
  generator.py: |
    import time
    import urllib.request
    import socket
    import json
    import os
    import random

    CONFIG_FILE = "/tmp/traffic-control"
    DEFAULT_CONFIG = "/etc/traffic-control/config.json"

    def read_config():
        cfg = {"state": "RUNNING", "multiplier": 1.0, "base_rps": 10.0}
        path = CONFIG_FILE if os.path.exists(CONFIG_FILE) else DEFAULT_CONFIG
        try:
            with open(path, "r") as f:
                content = f.read().strip()
                if content.startswith("{"):
                    cfg.update(json.loads(content))
                else:
                    for line in content.splitlines():
                        if "=" in line:
                            k, v = line.split("=", 1)
                            k = k.strip().lower()
                            v = v.strip()
                            if k == "state":
                                cfg["state"] = v
                            elif k in ("multiplier", "base_rps"):
                                cfg[k] = float(v)
        except Exception:
            pass
        return cfg

    def main():
        print("[Traffic-Generator] Netflix enterprise multi-tier viewer traffic simulator active...")
        fe_host = "frontend-service.klystr-multitier.svc.cluster.local"
        fe_url_api1 = f"http://{fe_host}:80/api1"
        fe_url_api2 = f"http://{fe_host}:80/api2"
        fe_url_dashboard = f"http://{fe_host}:80/dashboard"
        fe_url_bi = f"http://{fe_host}:80/bi"

        counter = 0
        while True:
            cfg = read_config()
            state = str(cfg.get("state", "RUNNING")).strip().upper()
            multiplier = float(cfg.get("multiplier", 1.0))
            base_rps = float(cfg.get("base_rps", 10.0))

            # Strict 0 RPS when STOPPED or PAUSED
            if state in ("STOPPED", "PAUSED", "HALTED"):
                time.sleep(0.5)
                continue

            target_rps = max(1.0, base_rps * multiplier)
            sleep_interval = 1.0 / target_rps

            roll = random.random()
            if roll < 0.45:
                target_url = fe_url_api1
            elif roll < 0.80:
                target_url = fe_url_api2
            elif roll < 0.92:
                target_url = fe_url_dashboard
            else:
                target_url = fe_url_bi

            try:
                req = urllib.request.Request(
                    target_url,
                    headers={
                        "User-Agent": "Netflix-ExoPlayer/2.18.2 (Linux; Android 14; BRAVIA-4K)",
                        "X-Device-Type": "SmartTV-4K-UHD",
                        "X-Client-Tier": "edge-viewer",
                        "X-Session-Source": "synthetic-audience"
                    }
                )
                with urllib.request.urlopen(req, timeout=1.5) as resp:
                    resp.read()
            except Exception:
                pass

            counter += 1
            # Periodically generate intentional closed-port connection attempt for eBPF TCP RST drop/rejection telemetry
            if counter % 25 == 0:
                try:
                    s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                    s.settimeout(0.1)
                    s.connect((fe_host, 9999))
                    s.close()
                except Exception:
                    pass

            time.sleep(sleep_interval)

    if __name__ == "__main__":
        main()
---
# ==========================================
# 1. PostgreSQL OLTP Primary (StatefulSet 1x)
# Core metadata: user accounts, subscriptions, DRM licenses
# ==========================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: klystr-multitier
  labels:
    app: db
    app.kubernetes.io/name: postgresql-primary
    app.kubernetes.io/part-of: klystr-telemetry
    telemetry: klystr-multitier
spec:
  serviceName: db-service
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
        app.kubernetes.io/name: postgresql-primary
        app.kubernetes.io/part-of: klystr-telemetry
        telemetry: klystr-multitier
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        imagePullPolicy: IfNotPresent
        env:
        - name: POSTGRES_DB
          value: postgres
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_HOST_AUTH_METHOD
          value: trust
        ports:
        - containerPort: 5432
          name: postgres
        readinessProbe:
          tcpSocket:
            port: 5432
          initialDelaySeconds: 2
          periodSeconds: 2
        lifecycle:
          postStart:
            exec:
              command:
              - /bin/sh
              - -c
              - >
                until pg_isready -h 127.0.0.1 -p 5432 -U postgres; do sleep 1; done;
                if ! grep -q "host replication all all trust" /var/lib/postgresql/data/pg_hba.conf; then
                  echo "host replication all all trust" >> /var/lib/postgresql/data/pg_hba.conf;
                  psql -U postgres -c "SELECT pg_reload_conf();";
                fi
        resources:
          requests:
            cpu: 20m
            memory: 48Mi
          limits:
            cpu: 200m
            memory: 128Mi
