apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db-replica
  namespace: klystr-multitier
  labels:
    app: db-replica
    app.kubernetes.io/name: postgresql-cascading-replicas
    app.kubernetes.io/part-of: klystr-telemetry
    telemetry: klystr-multitier
spec:
  serviceName: db-replica-nodes
  replicas: 2
  selector:
    matchLabels:
      app: db-replica
  template:
    metadata:
      labels:
        app: db-replica
        app.kubernetes.io/name: postgresql-cascading-replicas
        app.kubernetes.io/part-of: klystr-telemetry
        telemetry: klystr-multitier
    spec:
      containers:
      - name: postgres-replica
        image: postgres:16-alpine
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c"]
        args:
        - >
          INDEX=$(echo $HOSTNAME | awk -F'-' '{print $NF}');
          echo "[Replica Boot] Node $HOSTNAME (Index: $INDEX)";
          if [ "$INDEX" = "0" ]; then
            UPSTREAM="db-service.klystr-multitier.svc.cluster.local";
            echo "[Replica-0] Waiting for Primary DB $UPSTREAM:5432...";
            until pg_isready -h "$UPSTREAM" -p 5432 -U postgres; do sleep 1; done;
          else
            UPSTREAM="db-replica-0.db-replica-nodes.klystr-multitier.svc.cluster.local";
            echo "[Replica-1] Waiting for Cascading Parent Replica-0 $UPSTREAM:5432...";
            until pg_isready -h "$UPSTREAM" -p 5432 -U postgres; do sleep 1; done;
          fi;
          echo "[Replica Boot] Performing pg_basebackup from $UPSTREAM...";
          rm -rf /var/lib/postgresql/data/*;
          PGPASSWORD="" pg_basebackup -h "$UPSTREAM" -p 5432 -U postgres -D /var/lib/postgresql/data -Fp -Xs -R;
          chown -R postgres:postgres /var/lib/postgresql/data;
          chmod 700 /var/lib/postgresql/data;
          if ! grep -q "host replication all all trust" /var/lib/postgresql/data/pg_hba.conf; then
            echo "host replication all all trust" >> /var/lib/postgresql/data/pg_hba.conf;
          fi;
          echo "[Replica Boot] Starting PostgreSQL standby server...";
          exec su-exec postgres postgres -D /var/lib/postgresql/data;
        ports:
        - containerPort: 5432
          name: postgres
        readinessProbe:
          exec:
            command: ["pg_isready", "-h", "127.0.0.1", "-p", "5432", "-U", "postgres"]
          initialDelaySeconds: 4
          periodSeconds: 2
        resources:
          requests:
            cpu: 20m
            memory: 48Mi
          limits:
            cpu: 200m
            memory: 128Mi
