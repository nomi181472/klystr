apiVersion: v1
kind: ConfigMap
metadata:
  name: api-server-script
  namespace: klystr-multitier
  labels:
    app.kubernetes.io/name: api-server-script
    telemetry: klystr-multitier
data:
  server.py: |
    import http.server
    import socket
    import struct
    import json
    import uuid
    import datetime
    import os

    API_NAME = os.environ.get("API_NAME", "api1")
    POD_NAME = os.environ.get("POD_NAME", "unknown-pod")

    def talk_to_redis(host="redis-master-service", port=6379):
        req_id = str(uuid.uuid4())[:8]
        if API_NAME == "api1":
            key = f"playback:session:{req_id}"
            val = f"pod:{POD_NAME}:user_{req_id}:stream=4k-uhd:bitrate=15.4mbps"
        else:
            key = f"catalog:recommendation:{req_id}"
            val = f"pod:{POD_NAME}:user_{req_id}:model=matrix-factorization:cache=hit"
        try:
            s = socket.create_connection((host, port), timeout=1.5)
            cmd = (
                f"*5\r\n$3\r\nSET\r\n${len(key)}\r\n{key}\r\n${len(val)}\r\n{val}\r\n$2\r\nEX\r\n$2\r\n60\r\n"
                f"*2\r\n$3\r\nGET\r\n${len(key)}\r\n{key}\r\n"
            )
            s.sendall(cmd.encode("utf-8"))
            resp = s.recv(1024)
            s.close()
            return "ok" if (b"+OK" in resp or b"$" in resp) else "unexpected_resp"
        except Exception as e:
            return f"error: {e}"

    def talk_to_postgres(host="db-service", port=5432):
        try:
            s = socket.create_connection((host, port), timeout=1.5)
            body = b'user\x00postgres\x00database\x00postgres\x00\x00'
            msg = struct.pack('!II', 8 + len(body), 196608) + body
            s.sendall(msg)
            buf = s.recv(4096)
            if b'Z' not in buf:
                buf += s.recv(4096)
            query = b'SELECT 1;'
            qmsg = b'Q' + struct.pack('!I', 4 + len(query) + 1) + query + b'\x00'
            s.sendall(qmsg)
            qresp = s.recv(4096)
            s.close()
            return "ok" if (b'C' in qresp or b'Z' in qresp or b'T' in qresp) else "unexpected_resp"
        except Exception as e:
            return f"error: {e}"

    class APIHandler(http.server.BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/healthz":
                self.send_response(200)
                self.end_headers()
                self.wfile.write(b"OK\n")
                return

            req_id = str(uuid.uuid4())[:8]
            redis_status = talk_to_redis()
            db_status = talk_to_postgres()

            if API_NAME == "api1":
                service_title = "playback-session-service"
                payload = {
                    "playback_session_id": f"nflx-sess-{req_id}",
                    "video_stream": {
                        "resolution": "3840x2160 (4K UHD)",
                        "hdr_format": "Dolby Vision Profile 8",
                        "audio_codec": "Dolby Atmos (E-AC3-JOC)",
                        "target_bitrate_mbps": 15.4,
                        "cdn_edge_pop": "openconnect-edge-iad1"
                    },
                    "drm_licensing": {
                        "scheme": "Widevine L1",
                        "license_status": "GRANTED",
                        "entitlement_tier": "PREMIUM_4_SCREENS"
                    }
                }
            else:
                service_title = "catalog-recommendation-service"
                payload = {
                    "recommendation_session_id": f"nflx-recom-{req_id}",
                    "personalization": {
                        "algorithm_version": "deep-retrieval-v3",
                        "vector_similarity_score": 0.942,
                        "trending_cluster": "global-top-10",
                        "cached_items_returned": 24
                    },
                    "metadata_store": {
                        "catalog_version": "2026.09.06",
                        "region": "GLOBAL"
                    }
                }

            data = {
                "platform": "Netflix-Cloud-Streaming",
                "service": service_title,
                "api": API_NAME,
                "pod": POD_NAME,
                "request_id": req_id,
                "details": payload,
                "storage_telemetry": {
                    "redis_playback_cache": redis_status,
                    "database_primary_oltp": db_status
                },
                "timestamp": datetime.datetime.now(datetime.timezone.utc).isoformat()
            }
            body = json.dumps(data, indent=2).encode("utf-8")
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, format, *args):
            return

    server = http.server.ThreadingHTTPServer(("0.0.0.0", 8080), APIHandler)
    print(f"[{API_NAME}] Server running on port 8080")
    server.serve_forever()
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: etl-service-script
  namespace: klystr-multitier
  labels:
    app.kubernetes.io/name: etl-service-script
    telemetry: klystr-multitier
data:
  etl_server.py: |
    import http.server
    import socket
    import struct
    import json
    import uuid
    import datetime
    import threading
    import time
    import random
    import os

    POD_NAME = os.environ.get("POD_NAME", "etl-pod")

    bi_store = {
        "platform": "Netflix-OpenConnect-Telemetry",
        "service": "streaming-qoe-analytics-engine",
        "pod": POD_NAME,
        "status": "HEALTHY",
        "data_source": "PostgreSQL Cascaded Read Replicas (db-replica-service:5432)",
        "total_batches_processed": 0,
        "total_events_extracted": 0,
        "active_stream_sessions": 1420500,
        "cdn_egress_gbps": 12.8,
        "catalog_impressions_sec": 8420,
        "cache_hit_ratio": 98.6,
        "rebuffer_ratio_pct": 0.24,
        "etl_latency_ms": 3.2,
        "last_batch_time": None,
        "latest_batches": []
    }
    lock = threading.Lock()

    def query_replica(host="db-replica-service.klystr-multitier.svc.cluster.local", port=5432):
        try:
            s = socket.create_connection((host, port), timeout=2.0)
            body = b'user\x00postgres\x00database\x00postgres\x00\x00'
            msg = struct.pack('!II', 8 + len(body), 196608) + body
            s.sendall(msg)
            buf = s.recv(4096)
            if b'Z' not in buf:
                buf += s.recv(4096)
            query = b'SELECT pg_is_in_recovery(), inet_server_addr(), current_timestamp;'
            qmsg = b'Q' + struct.pack('!I', 4 + len(query) + 1) + query + b'\x00'
            s.sendall(qmsg)
            qresp = s.recv(4096)
            s.close()
            return "ok" if (b'C' in qresp or b'Z' in qresp or b'T' in qresp) else "warn"
        except Exception as e:
            return f"error: {e}"

    def etl_worker():
        batch_num = 0
        while True:
            batch_num += 1
            t0 = time.time()
            status = query_replica()
            latency = (time.time() - t0) * 1000.0
            events_extracted = random.randint(450, 1250)

            with lock:
                bi_store["total_batches_processed"] += 1
                bi_store["total_events_extracted"] += events_extracted
                bi_store["etl_latency_ms"] = round(latency, 2)
                bi_store["active_stream_sessions"] = 1420000 + random.randint(500, 45000)
                bi_store["cdn_egress_gbps"] = round(12.4 + random.random() * 3.8, 2)
                bi_store["catalog_impressions_sec"] = 8200 + random.randint(50, 600)
                bi_store["rebuffer_ratio_pct"] = round(0.20 + random.random() * 0.08, 3)
                bi_store["last_batch_time"] = datetime.datetime.now(datetime.timezone.utc).isoformat()
                batch_entry = {
                    "batch_id": f"batch-{uuid.uuid4().hex[:6]}",
                    "batch_num": batch_num,
                    "replica_status": status,
                    "records": events_extracted,
                    "latency_ms": round(latency, 2),
                    "timestamp": bi_store["last_batch_time"]
                }
                bi_store["latest_batches"].insert(0, batch_entry)
                if len(bi_store["latest_batches"]) > 10:
                    bi_store["latest_batches"].pop()
            time.sleep(2.0)

    class BIHandler(http.server.BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/healthz":
                self.send_response(200)
                self.end_headers()
                self.wfile.write(b"OK\n")
                return

            if self.path in ("/api/bi/metrics", "/analytics", "/bi"):
                with lock:
                    data = dict(bi_store)
                    data["server_time"] = datetime.datetime.now(datetime.timezone.utc).isoformat()
                body = json.dumps(data, indent=2).encode("utf-8")
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)
                return

            if self.path in ("/dashboard", "/"):
                with lock:
                    d = dict(bi_store)
                html = f"""<!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
