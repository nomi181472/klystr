<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>Klystr</title>
  <style>
    :root { --logo-color: #c5c8d0; --logo-background: #1d1f23; color-scheme: dark; }
    @media (prefers-color-scheme: light) {
      :root { --logo-color: #4e5054; --logo-background: #f5f6f7; color-scheme: light; }
    }
    .orbit { transform-origin: 16px 16px; animation: rotate 7s linear infinite; }
    @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>
  <circle cx="16" cy="16" r="14" fill="var(--logo-background)" stroke="var(--logo-color)" stroke-opacity=".65" stroke-width="1.5"/>
  <circle cx="16" cy="16" r="9.5" fill="none" stroke="var(--logo-color)" stroke-opacity=".7" stroke-width="1.5"/>
  <circle cx="16" cy="16" r="4" fill="var(--logo-color)" fill-opacity=".3"/>
  <g class="orbit">
    <circle cx="25.5" cy="16" r="2.5" fill="var(--logo-color)"/>
  </g>
</svg>
