<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <title>Klystr</title>
  <defs>
    <style>
      :root {
        --logo-bg: #000000;
        --logo-fg: #FFFFFF;
        --logo-border: rgba(255, 255, 255, 0.18);
        --logo-circle: rgba(255, 255, 255, 0.85);
        color-scheme: dark light;
      }
      .logo-tile { fill: #000000; }
      .logo-inner-border { stroke: rgba(255, 255, 255, 0.18); }
      .logo-ambient { stroke: #FFFFFF; opacity: 0.15; }
      .logo-main-circle { stroke: rgba(255, 255, 255, 0.85); }
      .logo-k-line { stroke: #FFFFFF; }
      .logo-node-point { fill: #FFFFFF; }

      @media (prefers-color-scheme: light) {
        :root {
          --logo-bg: #FFFFFF;
          --logo-fg: #111827;
          --logo-border: rgba(0, 0, 0, 0.15);
          --logo-circle: rgba(17, 24, 39, 0.85);
        }
        .logo-tile { fill: #FFFFFF !important; }
        .logo-inner-border { stroke: rgba(0, 0, 0, 0.15) !important; }
        .logo-ambient { stroke: #111827 !important; opacity: 0.12 !important; }
        .logo-main-circle { stroke: rgba(17, 24, 39, 0.85) !important; }
        .logo-k-line { stroke: #111827 !important; }
        .logo-node-point { fill: #111827 !important; }
      }
    </style>

    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Square rounded background tile -->
  <rect class="logo-tile" x="0" y="0" width="200" height="200" rx="32" ry="32" fill="var(--logo-bg, #000000)"/>

  <!-- Subtle inner border -->
  <rect class="logo-inner-border" x="6" y="6" width="188" height="188" rx="26" ry="26" fill="none" stroke="var(--logo-border, rgba(255, 255, 255, 0.18))" stroke-width="1.2"/>

  <!-- Background outer breathing ring -->
  <circle class="logo-ambient" cx="100" cy="100" r="78" fill="none" stroke="var(--logo-fg, #FFFFFF)" stroke-width="0.8" opacity="0.15"/>

  <!-- Complete Full Circle -->
  <circle class="logo-main-circle" cx="100" cy="100" r="72" fill="none" stroke="var(--logo-circle, rgba(255, 255, 255, 0.85))" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Subtle inner ring -->
  <circle class="logo-ambient" cx="100" cy="100" r="55" fill="none" stroke="var(--logo-fg, #FFFFFF)" stroke-width="0.6" opacity="0.15"/>

  <!-- ============ COMPLETE K LINES ============ -->
  <!-- Upper stem -->
  <line class="logo-k-line" x1="72" y1="58" x2="72" y2="100" stroke="var(--logo-fg, #FFFFFF)" stroke-width="7" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Lower stem -->
  <line class="logo-k-line" x1="72" y1="100" x2="72" y2="142" stroke="var(--logo-fg, #FFFFFF)" stroke-width="7" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Upper arm -->
  <line class="logo-k-line" x1="72" y1="100" x2="128" y2="58" stroke="var(--logo-fg, #FFFFFF)" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Lower arm -->
  <line class="logo-k-line" x1="72" y1="100" x2="128" y2="142" stroke="var(--logo-fg, #FFFFFF)" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>

  <!-- ============ COMPLETE NODES ============ -->
  <!-- Center joint -->
  <circle class="logo-node-point" cx="72" cy="100" r="5.5" fill="var(--logo-fg, #FFFFFF)" filter="url(#softGlow)"/>

  <!-- Top of stem -->
  <circle class="logo-node-point" cx="72" cy="58" r="4.5" fill="var(--logo-fg, #FFFFFF)" filter="url(#softGlow)"/>

  <!-- Bottom of stem -->
  <circle class="logo-node-point" cx="72" cy="142" r="4.5" fill="var(--logo-fg, #FFFFFF)" filter="url(#softGlow)"/>

  <!-- End of upper arm -->
  <circle class="logo-node-point" cx="128" cy="58" r="4.5" fill="var(--logo-fg, #FFFFFF)" filter="url(#softGlow)"/>

  <!-- End of lower arm -->
  <circle class="logo-node-point" cx="128" cy="142" r="4.5" fill="var(--logo-fg, #FFFFFF)" filter="url(#softGlow)"/>
</svg>
