apiVersion: v1
kind: Namespace
metadata:
  name: klystr
  labels:
    app.kubernetes.io/name: klystr
    app.kubernetes.io/managed-by: klystr
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: klystr-scanner
  namespace: klystr
automountServiceAccountToken: false
---
# Bind this Role to the identity used by the Klystr server, not the scanner Job.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: klystr-scan-controller
  namespace: klystr
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "create"]
  # Required only when TRIVY_REGISTRY_SECRET or TRIVY_JOB_IMAGE_PULL_SECRET is configured.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: klystr-scan-controller
  namespace: klystr
subjects:
  - kind: ServiceAccount
    name: klystr
    namespace: klystr
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: klystr-scan-controller
---
# Required only when Klystr should create its project namespace automatically.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: klystr-project-namespace
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: klystr-project-namespace
subjects:
  - kind: ServiceAccount
    name: klystr
    namespace: klystr
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: klystr-project-namespace
